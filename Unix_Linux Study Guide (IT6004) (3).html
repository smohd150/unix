<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unix/Linux Study Guide (IT6004)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#14213d;--mute:#52607a;--line:#d5dce6;--acc:#0f766e;--accbg:#d9f0ec;--code:#e6ebf2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--panel:#16213a;--ink:#e6ecf7;--mute:#9fb0cc;--line:#2a3856;--acc:#5fd1c3;--accbg:#173a42;--code:#1f2d4a}}
:root[data-theme="dark"]{--bg:#0e1626;--panel:#16213a;--ink:#e6ecf7;--mute:#9fb0cc;--line:#2a3856;--acc:#5fd1c3;--accbg:#173a42;--code:#1f2d4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.9em}
.wrap{display:grid;grid-template-columns:250px 1fr;max-width:1100px;margin:0 auto;min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--line)}
nav h1{font-size:1.1rem;margin:0 0 4px;line-height:1.3}
nav p{margin:0 0 18px;color:var(--mute);font-size:.85rem}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:9px 12px;font:inherit;cursor:pointer;border-radius:0 6px 6px 0}
nav button:hover{background:var(--accbg)}
nav button[aria-current="true"]{border-left-color:var(--acc);background:var(--accbg);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:32px clamp(16px,4vw,48px) 64px;max-width:820px}
main h2{font-size:1.9rem;line-height:1.2;margin:0 0 12px}
main h3{font-size:1.1rem;margin:28px 0 8px}
.lead{font-size:1.08rem;color:var(--mute);margin:0}
ul{padding-left:1.2rem}li{margin:6px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:420px}
td,th{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}th{background:var(--code);font-weight:600}
td:first-child{white-space:nowrap}
td code{background:var(--code);padding:2px 6px;border-radius:4px}
.q{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:16px 18px}
.q p{margin:0 0 12px}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.ans{display:none;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);white-space:pre-wrap}
.ans.on{display:block}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.pager .btn{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input{flex:1;min-width:180px}
.theme{margin-top:18px;font-size:.85rem}
@media (max-width:760px){
.wrap{display:block}
nav{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
nav h1,nav p{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
nav button[aria-current="true"]{border-bottom-color:var(--acc)}
.theme{display:none}
}
figure{margin:0;flex:1 1 300px;max-width:100%}figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}figcaption{font-size:.85rem;color:var(--mute);margin-top:6px}
.figs{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:16px 0;overflow-x:auto}
.fr{display:flex;align-items:center;gap:8px;margin-top:10px;min-width:max-content}
.bx{background:var(--accbg);border:1px solid var(--acc);border-radius:6px;padding:6px 10px;font-size:.9rem}
.ar{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<nav id="nav" aria-label="Units"></nav>
<main id="main" tabindex="-1"></main>
</div>

var U=[
{t:'Unit 1: Introduction to Unix',lead:'What an operating system is, and where Unix and Linux fit in.',
s:[['What is an operating system (OS)?',['The OS is the manager of the computer. It sits between the hardware (CPU, memory, disks, screen) and the programs you run.','It shares the hardware between programs, stores files, and controls who may do what.','Examples besides Windows and Unix/Linux: macOS, Android, iOS, Solaris, HP-UX.']],
['Unix and Linux',['Unix dates from the late 1960s. It is multi-user: more than one person can use it at the same time.','Linux is a free, open-source version of Unix written by Linus Torvalds and thousands of volunteers.','A distribution is a packaged flavour of Linux. This course uses Amazon Linux 2 on servers hosted on AWS.'],[['Operating system','Version','Edition / distribution'],['Windows','XP, Vista, Windows 7','XP Home, XP Professional, Vista Home, Vista Business'],['macOS','10.5 Leopard, 10.6 Snow Leopard, 10.7 Lion','none'],['Linux','none','Red Hat, Ubuntu, SUSE'],['Unix','none','HP-UX, Solaris']]],
['The software layers (top to bottom)',['Each layer sends requests to the layer below and replies to the layer above. The OS is the "middle-ware": it connects applications to hardware. This is true for Unix, Windows and Mac.'],[['Layer','What it is'],['User-written applications','Programs you or others write'],['Unix commands and libraries','Ready-made tools such as ls and cp, and reusable code'],['System call interface','The doorway programs use to ask the kernel for something'],['Kernel','The core of the OS, controls CPU, memory and devices'],['Hardware','Disks, video, memory']]],
['Programming interfaces',['API means Application Program Interface: how programs talk to the OS. Unix uses C header files (like math.h) and system calls such as int mkdir(const char *path, mode_t mode). Windows uses WinAPI, a large set of libraries.'],[['','Unix / Linux','Windows'],['Command line','sh / bash','cmd.exe'],['Make a folder','mkdir','md']]],
['GUI and CLI',['GUI = windows, icons and mouse. On Linux it is called a desktop environment (GNOME, KDE) and is just another program running on the OS.','CLI = typing commands. Developers and admins use it most. It is fast, works on slow links and can be automated.','You reach the CLI with PuTTY over SSH (a secure remote login). Remote Desktop gives a GUI but is optional.']],
['Logging in for the first time',['Open PuTTY, enter the host name (for example student1.bptest.cloud), port 22. On a Mac use ssh username@student1.bptest.cloud.','Username is a capital A plus your student ID, for example A20161234. It is case sensitive.','Change your password with passwd. Nothing shows while you type it. This is normal.','Leave with exit. Never just close the window, because the session stays active.']],
['Linux compared with Windows',['Linux can do everything Windows can and has a huge amount of free software.','Viruses for Linux are rare. It runs on desktops, servers, Android phones and satellite receivers.','Class software list: Google Earth (maps), Skype (calls), Apache (web server), Emacs (editor), PostgreSQL (database), LibreOffice (office), PHP (web language), GIMP (images), GNOME and KDE (desktops).']]],
c:[['passwd','Change your password'],['exit','End your session properly'],['ssh user@host','Log in to a remote machine securely']],
q:'A friend says "Linux and Ubuntu are the same thing". Explain why that is not quite right.',a:'Linux is the operating system family (kernel plus tools). Ubuntu is one distribution of it, like Red Hat, SUSE or Amazon Linux.'},
{t:'Unit 2A: The File System',lead:'How files are organised, and the first commands you need.',
s:[['What is a file system?',['It is the way an OS organises data on disk. It must let you create, modify and delete files, and be efficient.','A file is a collection of related data, seen as a stream of bytes. Its attributes are: type, name, size, owner, protection (who may use it) and timestamps.','Many file systems exist; just recognise the names.'],[['File system','Used on'],['FAT12, FAT16, FAT32','DOS, Windows'],['NTFS','Windows'],['ext2, ext3, ext4','Linux / Unix'],['HFS Plus','Mac'],['ISO-9660','CDs'],['UFS','Sun / Solaris']]],
['Windows vs Linux',['Linux treats A.txt and a.txt as two different files. In Windows the second would replace the first.','Spaces in names cause trouble on the command line in both. Use _ instead.'],[['','Windows','Linux'],['Top of the structure','Drives (C:, D:)','One tree starting at /'],['Separator','Backslash','Forward slash'],['Case sensitive?','No','Yes'],['List a folder','dir','ls'],['Show a file','type','cat or more'],['Make a folder','md','mkdir']]],
['The Linux folder map',['Everything hangs off / (root). Do not confuse /home (holds everyone) with your own home folder, such as /home/A20161234, which can be written ~ .'],[['Folder','What lives there'],['/','Root of everything'],['/bin','Essential programs (cat, ls, cp)'],['/boot','Boot loader and kernels'],['/dev','Device files, e.g. /dev/null'],['/etc','System configuration files'],['/home','Users home folders'],['/lib','Libraries for /bin and /sbin'],['/media','Removable media (USB, DVD)'],['/mnt','Temporarily mounted file systems'],['/root','Home of the root (admin) user'],['/sbin','Essential system programs (fsck, init)'],['/tmp','Temporary files, often wiped on reboot']],1],
['The prompt',['[robert@student1 ~]$ shows your login name, the server name, your location (~ = home folder) and $ meaning "waiting for a command". The shell is bash.']],
['Basic file jobs',['There is no recycle bin. rm is permanent. Use rmdir only on empty folders.'],[['Action','Folder','File'],['Create','mkdir','touch'],['Move or rename','mv','mv'],['Copy','cp -r (keep attributes: -p)','cp'],['Delete','rmdir or rm -r','rm']]],
['Reading ls -l',['drwxr-xr-x 2 robert robert 4096 Sep 13 13:09 Desktop','d = type. rwx = owner permissions, r-x = group, r-x = others. Then: links, owner, group, size in bytes, last change, name.','All devices are treated as files too.'],[['Letter','Type'],['-','Regular file'],['d','Directory'],['l','Symbolic link'],['p','Named pipe'],['s','Socket'],['c or b','Device file'],['D','Door']],1],
['Input and output redirection',['Every running program gets 3 channels: STDIN (input, normally keyboard), STDOUT (output, normally screen) and STDERR (error messages). Redirection changes where they point.'],[['Symbol','Meaning','Example'],['>','Send output to a file, replacing it','echo ABC > A.txt'],['>>','Append to the end of a file','echo more >> A.txt'],['<','Take input from a file','sort < list.txt']],1],
['Slide questions answered',['Does ls -l > ~/output.txt list output.txt itself? Yes. The shell creates the empty file first.','File holds A and B, then echo C > X.log and echo D > X.log. Only D is left, because > wipes the file each time.','File holds A and B, then echo "This is Appending" >> file. Result: A, B, This is Appending.']]],
c:[['pwd','Show the current folder'],['ls -a','Include hidden files'],['ls -l','Long format'],['ls -al','Both'],['touch f','Create an empty file'],['echo text','Print text'],['cat f / more f','Show a file'],['mkdir / rmdir','Make / delete a folder'],['cp -r / mv / rm -r','Copy folders / move or rename / delete folders'],['du','Space used by files'],['df','Free disk space'],['echo hi > f','Write text into a file'],['echo hi >> f','Append text to a file']],
q:'Write the commands to create notes.txt containing hello, add a second line world, then show the file.',a:'echo hello > notes.txt\necho world >> notes.txt\ncat notes.txt'},
{t:'Unit 2B: Manuals and Paths',lead:'Teaching yourself commands, and pointing at files correctly.',
s:[['The manual: man',['man ls opens the manual for ls. Space = next page, Enter = next line, q = quit.','You must know the exact command name. If not, search by keyword: man -k remove | more.','man man explains man itself. Many commands also accept --help.'],[['Part of a man page','What it holds'],['NAME','Command name and one-line summary'],['SYNOPSIS','The shape of the command'],['DESCRIPTION','Details and the list of options'],['AUTHOR / REPORTING BUGS / COPYRIGHT','Who wrote it, where to report bugs, licence'],['SEE ALSO','Related commands']]],
['Handy options for core commands',['ls -a shows hidden files, -l gives details, -al does both. Extra: -A (hidden, without . and ..), -s (sizes), -t (newest first).'],[['Command','Useful options'],['cd','cd or cd ~ home, cd .. up, cd - back'],['mkdir','-p makes parents too'],['cp','-r folders, -p keep attributes'],['rm','-r folders, -i ask first, -f force'],['mv','-i ask before overwriting']],1],
['Absolute and relative paths',['Absolute path: starts at / and works from anywhere, e.g. /home/sara/pics/cat.jpg.','Relative path: starts from where you are and never begins with /, e.g. ../pics/cat.jpg.','Shortcuts: ~ your home, . here, .. the parent folder.','Absolute is clear and safe. Relative is shorter and survives moving the whole folder.','Example: you are in /home/sara/docs. The relative path to /home/sara/pics/cat.jpg is ../pics/cat.jpg.']],
['Making a whole tree with one command',['mkdir -p creates missing parents. Braces list several children. No spaces inside the braces.','mkdir -p tmpdir/{branches,tags,trunk/sources/{includes,docs}} builds tmpdir with branches, tags, and trunk/sources/includes and docs.','mkdir -p tempfolder/{bin/{dir1/dir2,dir5},test/unix/{dir3,dir4},lib} builds five folders: bin/dir1/dir2, bin/dir5, test/unix/dir3, test/unix/dir4 and lib.','Quote names with spaces: mkdir "Green Day". Press Tab to auto-complete. Keep a folder per unit and per lab.']]],
c:[['man cmd','Open a manual'],['man -k word','Search manuals by keyword'],['cmd --help','Quick option list'],['cd -','Back to the previous folder'],['mkdir -p a/b/c','Make nested folders'],['mkdir -p a/{b,c}','Make a/b and a/c'],['ls -A / -s / -t','Almost all / sizes / newest first']],
q:'From /home/sara/project/docs, give the relative path to /home/sara/project/src/tests. Then write one command creating project/src/{code,tests} and project/docs.',a:'Relative: ../src/tests\nCommand: mkdir -p project/{src/{code,tests},docs}'},
{t:'Unit 3: Text Editors, Backups, Archives',lead:'Editing with vi, protecting files, bundling them up.',
s:[['Kinds of editor',['Word processors add hidden formatting, so they are not for scripts or config files. That is why a .docx looks strange in a text or hex editor.'],[['Kind','What it does','Examples'],['Binary (hex) editor','Edits any file byte by byte; rarely needed','HxD, ghex2'],['Text editor','Edits plain printable text','Notepad, vi'],['Word processor','Formatted documents','MS Word']]],
['Line endings',['Windows ends a line with CR+LF (hex 0D 0A). Unix uses only LF (0A).','Notepad can show a Unix file as one long line. A Windows script on Unix fails because of ^M. Fix with dos2unix (the file gets smaller).']],
['GUI vs command-line editors',['gedit is a graphical editor and needs a window system (X).','Use a non-graphical editor when there is no GUI, the link is slow, or you are root (root normally has no window environment).','vi (visual editor) draws text in rows and columns on the terminal. vim often replaces it.']],
['Starting vi',[],[['Command','Meaning'],['vi','Open on an empty file'],['vi file','Create or edit file'],['vi -r file','Recover after a crash'],['vi + file','Open at the last line'],['vi +n file','Open at line n']],1],
['The three modes',['1. vi mode: where vi starts. Keys are commands. ESC always brings you back here.','2. Command mode: press : (or / for search) then type a command.','3. Input mode: where typing goes into the file. Enter with i, a, o. Leave with ESC.','If vi acts strange, press ESC.']],
['Main vi keys',[],[['Keys','What they do'],['h j k l','Left, down, up, right'],['Ctrl-f / Ctrl-b','Forward / back one screen'],['G','End of file (:5 goes to line 5)'],['i / a / A','Insert before / append after / append at line end'],['o / O','New line below / above'],['r / R','Replace one character / overwrite'],['x / dw / dd','Delete character / word / line'],['yy then p','Copy a line, paste'],['u','Undo'],['/text, n, N','Search, next, previous'],[':w  :q  :wq  :x  ZZ','Save / quit / save+quit / save+quit / save+quit'],[':q!','Quit without saving'],[':w name','Save under another name'],[':r file','Insert another file']],1],
['Search and replace',['Format :%s/old/new/flags. % = every line, g = all matches on a line, c = confirm each.'],[['Command','Effect'],[':%s/Mnday/Monday/g','Replace all'],[':%s/Mnday/Monday/gc','Replace all, asking each time'],[':5,12s/Bahrin/Bahrain/g','Only lines 5 to 12'],[':s/string','Careful: deletes the string']],1],
['Backups and archives',['Before editing an important file: cp file file.bak. Edit, test, then keep or restore. Lab 3 adds the date as ddmmyy.','tar joins files into one archive. gzip makes it smaller; bzip2 is smaller still but slower. Without a name after x, tar extracts everything.'],[['Flag','Meaning'],['c','Create'],['t','List contents'],['x','Extract'],['f','File name follows (required)'],['v','Verbose'],['z','gzip'],['j','bzip2']],1],
['Moving files to your PC',['100 files on a server? Tar and compress them into one file, then download that one.','SFTP (psftp): open host, lcd sets your local folder, get / put move one file, mget / mput move many, bye leaves. Mac: scp user@host:/path/file .']]],
c:[['vi file','Open or create a file'],['dos2unix f','Fix Windows line endings'],['cp f f.bak','Backup copy'],['tar -cvf a.tar files','Create an archive'],['tar -tvf a.tar','List an archive'],['tar xvf a.tar','Extract'],['tar -cvzf a.tar.gz dir','Archive + gzip'],['tar xvzf a.tar.gz','Extract gzip archive'],['tar -cvjf a.tar.bz2 dir','Archive + bzip2'],['zip -r a.zip dir','Zip a folder'],['zipinfo a.zip','List a zip'],['unzip a.zip','Extract a zip'],['gzip / gunzip','Compress / uncompress one file'],['get / put / mget / lcd','SFTP: download, upload, many files, local folder'],['scp','Copy over SSH']],
q:'In vi, replace every colour with color asking each time, then save and quit. In the shell, bundle report.txt and report.bak into backup.tar.gz.',a:':%s/colour/color/gc\n:wq\ntar -cvzf backup.tar.gz report.txt report.bak'},
{t:'Unit 4: Users and Permissions',lead:'Who can log in, and who can do what with each file.',
s:[['Users and groups',['Windows recap: admin and standard accounts. Daily use of admin is risky because a mistake or virus has full power.','Unix is multi-user. A user is a login account (yours is A + student ID). A group is a collection of users, which makes permissions easier. A user can be in many groups, but must log out and in to see a new one.','Account types: root (superuser, can do anything), system accounts (services such as mail and sshd), and user accounts (limited).','Old or unused accounts are favourite attack targets, so keep accounts tidy.']],
['Managing accounts on the command line',['useradd -c "John from Accounts" -m -s /bin/bash john: -c comment, -m create /home/john, -s login shell. Also -d home, -g group, -u user ID.','A new user also gets a mail spool in /var/spool/mail/john. Set the password with passwd john (as root).','CLI is best for many accounts at once (can be automated). GUI tools are friendlier for small jobs.'],[['Job','User','Group'],['Add','useradd','groupadd'],['Delete','userdel','groupdel'],['Modify','usermod','groupmod'],['Password','passwd','gpasswd']],1],
['Removing a user safely',['Adam retires and you run plain userdel adam. His HR files stay behind.','Unix reuses user and group IDs. A new employee given Adam old ID automatically owns every leftover file.','userdel -r removes the home folder and mail spool, but files elsewhere must be found and removed by hand. Remove them all.']],
['Special files in /etc',['One line of passwd has 7 fields: john:x:1001:1001:John from Accounts:/home/john:/bin/bash = name, password placeholder, UID, GID, description, home, shell.','Passwords moved out of passwd because everyone can read it and modern hardware cracks them in minutes. Edit these files with vipw (passwd), vipw -s (shadow), vigr (group), vigr -s (gshadow).','who lists who is logged in, useful before maintenance or to spot odd logins.'],[['File','Contains'],['/etc/passwd','List of users'],['/etc/shadow','Encrypted passwords, not world-readable'],['/etc/group','Groups and members'],['/etc/gshadow','Encrypted group passwords']],1],
['File permissions',['Three classes: u (owner), g (group), o (others). Three rights: r read, w write, x execute. Example -rwxr-xr-- : owner rwx, group r-x, others r--.','Numbers: read 4 + write 2 + execute 1. So 7 = rwx, 6 = rw-, 5 = r-x, 4 = r--, 0 = nothing. chmod 640 = owner rw-, group r--, others none.','Execute on a text file only matters if it is a script. Execute on a folder means you may enter it.'],[['Command','Meaning'],['chmod 744 f','Owner all, others read only'],['chmod u+wx f','Add write and execute for owner'],['chmod g-r,o-w f','Remove group read, others write'],['chmod u=rw,g=r,o= f','Set exactly'],['chmod 644 *.txt','Wildcard: all .txt files']],1],
['Folder permissions',['r = list the names. w = create, delete or rename files. x = search: needed to cd in and see file details.','Read without execute: ls shows names, ls -l shows only question marks.','Write on a folder lets you rm a file inside even if the file has no permissions, because you change the folder list, not the file.']],
['Wildcards and grep',['A wildcard stands for other characters and works with any command. Slide note: in bash a hidden name starting with a dot is not matched by * unless you ask.','grep PATTERN FILE prints lines containing the pattern. Quote phrases. With no file it reads input, which is why it works after a pipe. Extras: -i ignore case, -n line numbers, -v invert, -c count.'],[['Wildcard','Matches','Example'],['*','Any string','ls -l *.txt'],['?','Exactly one character','ls ???'],['[ ]','One from a set or range','ls jones[0-9][0-9][0-9]']],1],
['The big picture',['Users belong to groups. Every file has an owner and a group. Permissions say what owner, group and others may do. Unix checks: are you the owner, in the group, or other? The first match decides.']]],
c:[['useradd -c -m -s name','Create a user'],['usermod','Change a user'],['userdel -r name','Delete user, home and mail'],['userdel -fr name','Force, even if logged in'],['passwd [name]','Set password'],['groupadd / groupmod / groupdel','Create / change / delete group'],['gpasswd','Group password or members'],['vipw / vigr','Safe edit of passwd / group files'],['chmod 640 f','Numeric permissions'],['chmod u+x,g-w f','Symbolic permissions'],['chgrp group f','Change a file group'],['who','Who is logged in'],['grep john /etc/passwd','Find one user']],
q:'A file shows -rw-r----- sara staff. What can each class do, and which two commands add group write?',a:'sara can read and write. staff can only read. Others have nothing.\nchmod 660 file   or   chmod g+w file'},
{t:'Unit 5: Processes and Pipes',lead:'Watching, controlling and chaining programs.',
s:[['What is a process?',['A process is a program that is running. It needs CPU, RAM and disk, managed by the OS. Every command you run starts one (even pwd). Each has a unique PID.','The kernel loads at boot, creates the first processes, stays in memory, time-slices the CPU, coordinates devices and manages virtual memory.','Parents create children, and they run at the same time, forming a process tree.']],
['ps: a snapshot',['ps shows only your processes. Combine options. ps -ef is the most useful.'],[['Column','Meaning'],['PID','Unique process ID'],['TTY','Terminal'],['TIME','CPU time used'],['CMD','Command that started it']],1],
['top: a live view',['top updates constantly (Windows equivalent: Task Manager). top -u user filters. To save one readable screen: top -n 1 -b > file.','CPU line: us user, sy kernel, ni low priority, id idle, wa waiting on disk, hi and si interrupts.'],[['Column','Meaning'],['PR / NI','Priority / nice value (negative = higher priority)'],['VIRT / RES / SHR','Virtual / physical / shared memory'],['S','State: R running, S sleeping, D deep sleep, Z zombie, T stopped'],['%CPU / %MEM','CPU and memory share'],['TIME+','CPU time to 1/100 second'],['COMMAND','What started it']],1],
['Stopping and prioritising',['Signals are messages to a process: Ctrl-C (interrupt), kill from the command line, or from a program.','kill PID asks politely. kill -9 PID forces it. killall name kills by name. Start a test job with sleep 300 & (the & runs it in the background).','nice sets priority from -20 (highest) to 19 (lowest). A high number is kinder to others. A hungry process can be found with top or ps, then reniced or killed.','Closing a Remote Desktop window does not log you off. Your processes can keep running.']],
['Pipes',['A pipe | sends one command output into the next. No temporary files.','Slow: who > names.txt then sort < names.txt > names_AZ.txt. Fast: who | sort > names_AZ.txt.','Examples: who | wc -l counts logged-in users. cat f | wc shows lines, words, bytes. ls -l | grep firefox filters a listing.'],[['Helper','Does'],['wc -l','Count lines'],['sort -r / -n','Reverse / numeric sort'],['uniq -c','Count repeated lines (sort first)'],['head / tail','First / last lines'],['cut -d. -f1','Keep field 1 split at a dot'],['rev','Reverse each line'],['grep','Keep matching lines. . = any one char, ^ start, $ end']],1],
['Decode a long pipeline',['ps -eo pcpu,pid,user,args | sort -r -k1 | less','1) ps lists every process with just CPU %, PID, user and command. 2) sort -r -k1 orders by column 1, highest first (add -n so 9.5 does not outrank 10.0). 3) less lets you scroll.','Result: all processes, busiest first.']]],
c:[['ps','Your processes'],['ps -ef','All processes, full format'],['ps -p PID','One process'],['top','Live view'],['top -u user','Live view, one user'],['top -n 1 -b > f','Save one screen'],['sleep N &','Test background process'],['jobs','List background jobs'],['kill PID','Stop politely'],['kill -9 PID','Force stop'],['killall name','Kill by name'],['nice -n N cmd','Run at priority N'],['who | wc -l','Count logged-in users'],['wc -l / sort / uniq -c','Count / sort / count repeats'],['cut / rev / head / tail','Cut fields / reverse / first / last lines']],
q:'In one command, count how many people are logged in. Then name two ways an admin can stop a runaway job slowing the server.',a:'who | wc -l\nLower its priority with nice, or stop it with kill / killall (find it first with top or ps).'},
{t:'Unit 6: Mail and Ethics',lead:'Sending mail from the terminal, and behaving as a trustworthy admin.',
s:[['The mail command',['mail -s "subject" address < file sends the file as the email body. The < is input redirection.','Without a file, type your message and end with Ctrl-D.','Class workflow: write answers in vi (ID and name on line 1), then mail the file to your tutor with a cc to yourself. Use two terminals: one to edit, one to test commands.'],[['Option','Meaning'],['-s','Subject (quote it if it has spaces)'],['-c','Carbon copy'],['-b','Blind carbon copy'],['-v','Verbose: show delivery details']],1],
['The code of ethics',['An admin can read everyone files, mail and passwords, so the profession has a code (LOPSA / LISA / USENIX) with ten parts.'],[['Principle','In plain words'],['Professionalism','Treat people fairly, whatever your feelings'],['Personal integrity','Be honest, admit mistakes, ask for help, declare conflicts'],['Privacy','Access private data only when your duties need it; keep it secret'],['Laws and policies','Learn the rules and teach them'],['Communication','Listen and talk to management, users, colleagues'],['System integrity','Keep systems reliable, secure and available'],['Education','Keep learning and share knowledge'],['Computing community','Cooperate to protect shared networks'],['Social responsibility','Encourage good policies and laws'],['Ethical responsibility','Safe workplace, public safety first, disclose risks, give credit, lead by example']]],
['Bahrain law',['Law No. 60 of 2014 on IT crimes, and Law No. 2 of 2017 ratifying the Arab Agreement on Combating IT Crimes.']],
['Scenario: your boss is stealing',['You are the NGO admin and the emails prove it.','Wrong: collect the email evidence yourself and hand it over.','Right: report the possible wrongdoing to management or police and follow normal justice procedure, giving evidence as the investigation asks.','Why: your access is for technical duties, not investigating people. An employee reports what they saw. An admin has extra duty not to abuse access.']],
['Reflection model (200 words on mail)',['What? Describe what mail can do. So what? Show how it could be misused (spam, leaking files, fake senders). Now what? Your actions as admin (policies, logging, within the law). How come? What you learned.']]],
c:[['mail -s "S" to < f','Send a file as email'],['mail -s "S" -c cc to < f','Add a carbon copy'],['mail -b / -v','Blind copy / verbose'],['cat a b > c','Join two files into one']],
q:'Your manager asks you to read a colleague mailbox "just to see". What do you do?',a:'Decline. The privacy principle allows access only when your technical duties require it. Ask for a formal, authorised request (for example via HR or legal) if there is a real investigation.'}
];

U[4].s.splice(7,0,['Special permissions and extras (Permissions slides)',['Linux permissions follow the POSIX standard (Portable Operating System Interface), a name coined by Richard Stallman, father of GNU.','Number examples: chmod 764 banana.txt = user rwx, group rw, other r. chmod 777 = everyone rwx.','For a folder, execute is needed as well as read, otherwise it cannot be browsed or entered.','Three special permissions: SETUID (4) runs a file as its owner, SETGID (2) runs it as its group, sticky bit (1) on a folder lets only the folder owner or root delete or rename files inside.','They go as an extra first digit: chmod 4762 f = setuid on, user rwx, group rw, other w. chmod 7444 f = setuid, setgid and sticky all on, everyone read only.','chmod -R 777 test changes the folder test and everything inside it (recursive). chown changes a file owner, chgrp changes its group.'],[['Symbolic command','Effect'],['chmod a+rw f','Add read and write for all (u, g and o)'],['chmod a-x f','Remove execute from all'],['chmod u=rwx,go=r f','User rwx, group and other read only'],['chmod u=rx,go= f','User read+execute, nobody else anything'],['chmod u-w f','Remove write from user'],['chmod g+wx f','Add write and execute to group'],['chmod o+rwx f','Add rwx to others'],['chmod u+s f  g+s f  o-t f','Add setuid, add setgid, remove sticky bit']],1]);
U[4].c.push(['chmod -R 777 dir','Change permissions recursively'],['chown user f','Change the owner of a file']);
